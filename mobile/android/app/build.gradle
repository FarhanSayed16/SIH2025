plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Local signing values belong in android/key.properties (never in source control).
// CI uses protected environment variables; relative storeFile paths use android/.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigning = [
    storeFile: System.getenv('ANDROID_KEYSTORE_PATH') ?: keystoreProperties.getProperty('storeFile'),
    storePassword: System.getenv('ANDROID_STORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword')
]

// Check the selected graph so debug builds, analysis and tests need no release key.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = ['assembleRelease', 'bundleRelease', 'packageRelease', 'validateSigningRelease']
        .any { graph.hasTask("${project.path}:${it}") }
    if (releaseRequested) {
        def missing = releaseSigning.findAll { key, value -> !value }.keySet()
        if (!missing.isEmpty()) {
            throw new GradleException("Release signing is required. Set ANDROID_KEYSTORE_PATH, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, or android/key.properties. Missing: ${missing.join(', ')}")
        }
        if (!rootProject.file(releaseSigning.storeFile).isFile()) {
            throw new GradleException('Release signing keystore does not exist. Check ANDROID_KEYSTORE_PATH or storeFile in android/key.properties.')
        }
    }
}

android {
    namespace "com.kavach.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.kavach.app"
        minSdkVersion flutter.minSdkVersion  // Android 5.0+ (required for modern Flutter packages)
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            storeFile releaseSigning.storeFile ? rootProject.file(releaseSigning.storeFile) : null
            storePassword releaseSigning.storePassword
            keyAlias releaseSigning.keyAlias
            keyPassword releaseSigning.keyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    // Explicitly include AndroidX Core KTX to fix TextInputPlugin crash
    // This ensures setStylusHandwritingEnabled() method is available
    implementation "androidx.core:core-ktx:1.15.0"
}

// Fix namespace for plugins that don't have it defined
// Note: AndroidX Core version is now explicitly set in dependencies block above
